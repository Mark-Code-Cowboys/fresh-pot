# Launcher icon generation: dart run flutter_launcher_icons
# Source art is generated (tool/make_icon.py): roast brown #5C3A21,
# a coffee pot with rising steam.
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#5C3A21"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 26
